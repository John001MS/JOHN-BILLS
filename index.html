<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.S. STORE Billing</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
<h1>M.S. STORE</h1>
<p>Billing Software</p>
</header>

<div class="container">
<div class="card">

<input type="text" id="itemName" placeholder="Product Name"><br><br>

<input type="number" id="itemQty" placeholder="Quantity"><br><br>

<input type="number" id="itemPrice" placeholder="Price"><br><br>

<button id="addItem">Add Item</button>

<hr>

<table border="1" width="100%" id="billTable">
<thead>
<tr>
<th>Item</th>
<th>Qty</th>
<th>Price</th>
<th>Total</th>
</tr>
</thead>
<tbody>
</tbody>
</table>

<h2>Grand Total: ₹<span id="grandTotal">0.00</span></h2>

<button onclick="window.print()">Print Bill</button>

</div>
</div>

<script src="js/script.js"></script>

</body>
</html>
