<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M.S. STORE Billing Software</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>M.S. STORE</h1>
      <p>Professional Billing Software</p>
    </header>

    <section class="customer">
      <h2>Customer Details</h2>

      <input type="text" id="customerName" placeholder="Customer Name / வாடிக்கையாளர் பெயர்">

      <input type="text" id="customerMobile" placeholder="Mobile Number">

      <div class="bill-info">
        <p><strong>Bill No:</strong> <span id="billNo"></span></p>
        <p><strong>Date:</strong> <span id="billDate"></span></p>
      </div>
    </section>

    <section class="billing">
      <h2>Add Product</h2>

      <input type="text" id="barcode" placeholder="Barcode">

      <input type="text" id="itemName" placeholder="Product Name">

      <input type="number" id="itemQty" placeholder="Qty">

      <input type="number" id="itemPrice" placeholder="Price">

      <button id="addItem">Add Item</button>
    </section>

    <table id="billTable">
      <thead>
        <tr>
          <th>Product</th>
          <th>Qty</th>
          <th>Price</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2>Total : ₹<span id="grandTotal">0.00</span></h2>

    <div class="buttons">
      <button onclick="window.print()">🖨 Print Bill</button>
      <button id="downloadPdf">📄 Download PDF</button>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
