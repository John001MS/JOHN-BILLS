<div class="card">

<h2>M.S. STORE</h2>

<p>
Bill No: <span id="billNo"></span><br>
Date: <span id="billDate"></span>
</p>

<input type="text" id="customerName" placeholder="Customer Name"><br><br>

<input type="text" id="customerMobile" placeholder="Mobile Number"><br><br>

<input type="text" id="itemName" placeholder="Product Name"><br><br>

<input type="number" id="itemQty" placeholder="Quantity"><br><br>

<input type="number" id="itemPrice" placeholder="Price"><br><br>

<button id="addItem">Add Item</button>

<hr>

<table border="1" width="100%" id="billTable">
<thead>
<tr>
<th>Item</th>
<th>Qty</th>
<th>Price</th>
<th>Total</th>
</tr>
</thead>
<tbody></tbody>
</table>

<h2>Grand Total: ₹<span id="grandTotal">0.00</span></h2>

<button onclick="window.print()">Print Bill</button>

</div>
